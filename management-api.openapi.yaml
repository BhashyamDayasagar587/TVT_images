openapi: 3.1.0
info:
  title: TVT Mills manager-facing edge API
  version: "1.0"
servers:
  - url: http://tvt-edge:8080
paths:
  /healthz:
    get:
      summary: Process liveness
      responses:
        "200": {description: Process is alive}
  /readyz:
    get:
      summary: Configuration and worker readiness
      responses:
        "200": {description: Desired state is applied and all configured workers are running}
        "503": {description: Configuration absent, rejected, or a worker is unavailable}
  /metrics:
    get:
      summary: Runtime counters
      responses:
        "200": {description: Runtime counters}
  /events:
    get:
      summary: Analytics Server-Sent Events
      parameters:
        - in: header
          name: Last-Event-ID
          schema: {type: integer, minimum: 0}
          description: Resume after this edge-local SSE cursor
      responses:
        "200":
          description: SSE stream; each analytics event has an id field and JSON data
          content: {text/event-stream: {}}
  /snapshots/{camera_id}/{file}:
    get:
      summary: Retrieve event evidence JPEG
      parameters:
        - {in: path, name: camera_id, required: true, schema: {type: string}}
        - {in: path, name: file, required: true, schema: {type: string}}
      responses:
        "200": {description: JPEG evidence}
        "404": {description: Not found}
